openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: readiness
    description: Peppol readiness scoring and dashboard operations
  - name: auth
    description: Authentication, active organization, and session identity
  - name: companies
    description: Client management within the session's organization
paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      description: >-
        Verifies credentials and starts a session. Accepts JSON only; form
        bodies are rejected so a cross-site form cannot sign a visitor in.
        Attempts are limited per client address and per email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      description: >-
        Creates a user together with a new organization in which that user is
        the owner, then starts a session exactly as sign-in does. Accepts JSON
        only. Attempts are limited per client address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created and session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An account with this email address already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      description: Destroys the current session.
      responses:
        "204":
          description: Session destroyed
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get the current session
      description: Returns the signed-in user, active organization, role, capabilities, and memberships.
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/organization:
    post:
      operationId: switchOrganization
      tags: [auth]
      summary: Switch the active organization
      description: Moves the session to another organization the signed-in user is a member of.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchOrganizationInput"
      responses:
        "200":
          description: Session moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not a member of that organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readiness/dashboard:
    get:
      operationId: getReadinessDashboard
      tags: [readiness]
      summary: Get readiness dashboard data
      description: >-
        Returns readiness KPIs, trends, risks, incidents, and companies for the
        organization the session is acting in. The tenant is derived from the
        session and is never accepted as a parameter.
      responses:
        "200":
          description: Readiness dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessDashboard"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /companies/{companyId}/readiness/calculate:
    post:
      operationId: calculateCompanyReadiness
      tags: [readiness]
      summary: Calculate company readiness
      description: >-
        Calculates and persists a new readiness assessment from weighted Peppol
        criteria. The company must belong to the session's organization.
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadinessAssessmentInput"
      responses:
        "200":
          description: Calculated readiness assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessAssessment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not permitted for this role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Company not found in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The company is archived; restore it before assessing it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List clients
      description: >-
        Clients of the session's organization, filtered, searched, sorted and
        paginated on the server. Archived clients are excluded unless status
        asks for them.
      parameters:
        - in: query
          name: search
          required: false
          description: Matches name, legal name, email, VAT number or registration number.
          schema:
            type: string
            maxLength: 100
        - in: query
          name: status
          required: false
          schema:
            $ref: "#/components/schemas/CompanyListStatus"
        - in: query
          name: peppolStatus
          required: false
          schema:
            $ref: "#/components/schemas/PeppolStatus"
        - in: query
          name: industry
          required: false
          schema:
            type: string
            maxLength: 100
        - in: query
          name: sort
          required: false
          schema:
            $ref: "#/components/schemas/CompanySort"
        - in: query
          name: page
          required: false
          schema:
            type: number
            minimum: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: One page of clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createCompany
      tags: [companies]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /companies/{companyId}:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      operationId: getCompany
      tags: [companies]
      summary: Get a client with its contacts
      responses:
        "200":
          description: The client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCompany
      tags: [companies]
      summary: Update a client
      description: Only the fields present are changed; null clears an optional field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdateInput"
      responses:
        "200":
          description: The updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /companies/{companyId}/archive:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    post:
      operationId: archiveCompany
      tags: [companies]
      summary: Archive a client
      description: Idempotent. An archived client keeps its history but leaves lists, the dashboard and assessments.
      responses:
        "200":
          description: The archived client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /companies/{companyId}/restore:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    post:
      operationId: restoreCompany
      tags: [companies]
      summary: Restore an archived client
      description: Idempotent.
      responses:
        "200":
          description: The restored client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /companies/{companyId}/contacts:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      operationId: listCompanyContacts
      tags: [companies]
      summary: List a client's contacts
      responses:
        "200":
          description: Contacts, primary first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientContact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createCompanyContact
      tags: [companies]
      summary: Add a contact to a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientContactInput"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientContact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /companies/{companyId}/contacts/{contactId}:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - $ref: "#/components/parameters/ContactId"
    patch:
      operationId: updateCompanyContact
      tags: [companies]
      summary: Update a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientContactUpdateInput"
      responses:
        "200":
          description: The updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientContact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
    delete:
      operationId: deleteCompanyContact
      tags: [companies]
      summary: Delete a contact
      description: Removes the contact's personal data permanently; the audit trail keeps only ids.
      responses:
        "204":
          description: Contact deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  parameters:
    CompanyId:
      in: path
      name: companyId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ContactId:
      in: path
      name: contactId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64

  responses:
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: The signed-in role lacks the required capability
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Not found in the session's organization
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Conflicts with existing data, such as a duplicate identifier or an archived client
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BadRequest:
      description: The request body is missing, malformed, or fails validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    PayloadTooLarge:
      description: The request body exceeds the size limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: Too many attempts; retry after the number of seconds in Retry-After
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: number
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                [
                  bad_request,
                  unauthorized,
                  forbidden,
                  not_found,
                  conflict,
                  payload_too_large,
                  too_many_requests,
                  internal_error,
                ]
            message:
              type: string
          required: [code, message]
      required: [error]
    MembershipRole:
      type: string
      enum: [OWNER, ADMIN, MEMBER, VIEWER]
    OrganizationPlan:
      type: string
      enum: [STARTER, PROFESSIONAL, ENTERPRISE]
    Capability:
      type: string
      enum:
        - workspace.manage
        - workspace.transfer
        - members.manage
        - clients.view
        - clients.write
        - clients.archive
        - scans.write
        - tasks.manage
        - reports.generate
        - reports.view
        - audit.viewAll
        - audit.viewOwn
    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 1
      required: [email, password]
    RegisterInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 256
      required: [name, email, password]
    SwitchOrganizationInput:
      type: object
      properties:
        organizationId:
          type: string
          minLength: 1
      required: [organizationId]
    SessionAccount:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        avatarInitials:
          type: string
          description: Nullable in the database; the server derives it from the name so the contract always carries a value.
        preferredLocale:
          type: string
      required: [id, name, email, avatarInitials, preferredLocale]
    SessionOrganization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        plan:
          $ref: "#/components/schemas/OrganizationPlan"
      required: [id, name, plan]
    SessionMembership:
      type: object
      properties:
        organizationId:
          type: string
        organizationName:
          type: string
        role:
          $ref: "#/components/schemas/MembershipRole"
      required: [organizationId, organizationName, role]
    Session:
      type: object
      description: >-
        Invariant: organization.id always appears in memberships, role is
        always that membership's role, and capabilities is always the
        derivation of role through the server's permission matrix.
      properties:
        user:
          $ref: "#/components/schemas/SessionAccount"
        organization:
          $ref: "#/components/schemas/SessionOrganization"
        role:
          $ref: "#/components/schemas/MembershipRole"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/SessionMembership"
      required: [user, organization, role, capabilities, memberships]
    CompanyListStatus:
      type: string
      enum: [active, archived, all]
    CompanySort:
      type: string
      enum: [name, -name, readinessScore, -readinessScore, lastCheckedAt, -lastCheckedAt, createdAt, -createdAt]
    CompanyInput:
      type: object
      additionalProperties: false
      description: >-
        Client details a user may set. Readiness score, Peppol status, last
        check, organization and archive state are owned by the server and are
        rejected here. VAT and registration numbers are stored in upper case
        without spaces or dots and must be unique within the organization.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        legalName:
          type: [string, "null"]
          maxLength: 200
        email:
          type: [string, "null"]
          maxLength: 254
        phone:
          type: [string, "null"]
          maxLength: 50
        registrationNumber:
          type: [string, "null"]
          maxLength: 32
        vatNumber:
          type: [string, "null"]
          maxLength: 32
        industry:
          type: [string, "null"]
          maxLength: 100
        accountingPackage:
          type: [string, "null"]
          maxLength: 100
        addressLine:
          type: [string, "null"]
          maxLength: 200
        postalCode:
          type: [string, "null"]
          maxLength: 20
        city:
          type: [string, "null"]
          maxLength: 100
        country:
          type: [string, "null"]
          pattern: "^[A-Za-z]{2}$"
          description: ISO 3166-1 alpha-2 code, stored in upper case.
      required: [name]
    CompanyUpdateInput:
      type: object
      additionalProperties: false
      description: Same fields as CompanyInput, all optional; null clears an optional field.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        legalName:
          type: [string, "null"]
          maxLength: 200
        email:
          type: [string, "null"]
          maxLength: 254
        phone:
          type: [string, "null"]
          maxLength: 50
        registrationNumber:
          type: [string, "null"]
          maxLength: 32
        vatNumber:
          type: [string, "null"]
          maxLength: 32
        industry:
          type: [string, "null"]
          maxLength: 100
        accountingPackage:
          type: [string, "null"]
          maxLength: 100
        addressLine:
          type: [string, "null"]
          maxLength: 200
        postalCode:
          type: [string, "null"]
          maxLength: 20
        city:
          type: [string, "null"]
          maxLength: 100
        country:
          type: [string, "null"]
          pattern: "^[A-Za-z]{2}$"
          description: ISO 3166-1 alpha-2 code, stored in upper case.
    Company:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        legalName:
          type: [string, "null"]
        email:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        registrationNumber:
          type: [string, "null"]
        vatNumber:
          type: [string, "null"]
        industry:
          type: [string, "null"]
        accountingPackage:
          type: [string, "null"]
        addressLine:
          type: [string, "null"]
        postalCode:
          type: [string, "null"]
        city:
          type: [string, "null"]
        country:
          type: [string, "null"]
        peppolStatus:
          $ref: "#/components/schemas/PeppolStatus"
        readinessScore:
          type: number
        lastCheckedAt:
          type: [string, "null"]
          format: date-time
        archivedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, legalName, email, phone, registrationNumber, vatNumber, industry, accountingPackage, addressLine, postalCode, city, country, peppolStatus, readinessScore, lastCheckedAt, archivedAt, createdAt, updatedAt]
    CompanyDetail:
      allOf:
        - $ref: "#/components/schemas/Company"
        - type: object
          properties:
            contacts:
              type: array
              items:
                $ref: "#/components/schemas/ClientContact"
          required: [contacts]
    CompanyPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Company"
        page:
          type: number
        pageSize:
          type: number
        total:
          type: number
      required: [items, page, pageSize, total]
    ClientContactInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: [string, "null"]
          maxLength: 254
        phone:
          type: [string, "null"]
          maxLength: 50
        role:
          type: [string, "null"]
          maxLength: 100
        isPrimary:
          type: boolean
          description: Marking a contact primary unmarks the client's previous primary contact.
      required: [name]
    ClientContactUpdateInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: [string, "null"]
          maxLength: 254
        phone:
          type: [string, "null"]
          maxLength: 50
        role:
          type: [string, "null"]
          maxLength: 100
        isPrimary:
          type: boolean
    ClientContact:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        role:
          type: [string, "null"]
        isPrimary:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, email, phone, role, isPrimary, createdAt, updatedAt]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PeppolStatus:
      type: string
      enum: [READY, CONFIGURING, AT_RISK, NOT_REGISTERED]
    RiskSeverity:
      type: string
      enum: [info, warning, critical]
    ReadinessAssessmentInput:
      type: object
      properties:
        participantRegistered:
          type: boolean
        receivingAddressConfigured:
          type: boolean
        peppolCapableSoftware:
          type: boolean
        certificateValid:
          type: boolean
        successfulTestInvoice:
          type: boolean
      additionalProperties: false
      description: >-
        Assessment answers only. The assessment time and its source are set by
        the server; requests that carry them, or any other field, are rejected.
      required:
        - participantRegistered
        - receivingAddressConfigured
        - peppolCapableSoftware
        - certificateValid
        - successfulTestInvoice
    ReadinessFactor:
      type: object
      properties:
        key:
