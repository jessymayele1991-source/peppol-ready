kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Apply pending migrations, then start. The server itself also refuses to listen
# when the database is behind this build, so a failed or skipped migration fails
# the startup health check instead of serving 500s. `prisma migrate deploy`
# takes an advisory lock, so concurrent instances starting together are safe.
# The pnpm hop costs startup time; it is the price of never running unmigrated.
args = ["sh", "-c", "pnpm --filter @workspace/peppol-flow run db:deploy && exec node --enable-source-maps artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
